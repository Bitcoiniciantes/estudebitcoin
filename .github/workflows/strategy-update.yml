name: Atualizar dados da Strategy

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: node scripts/atualizar_strategy.js
      - run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add dados/strategy.json dados/strategy-data.js
          git commit -m "Atualiza dados da Strategy" || echo "Sem mudanças"
          git push