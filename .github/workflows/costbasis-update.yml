name: Atualizar Cost Basis do Bitcoin

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '18'
      - run: node scripts/atualizar_costbasis.js
      - run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add dados/costbasis.json dados/costbasis-data.js
          git commit -m "Atualiza cost basis do Bitcoin" || echo "Sem mudanças"
          git push
