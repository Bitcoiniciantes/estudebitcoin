name: Atualizar Historico ETF BTC

on:
  schedule:
    - cron: '0 1 * * 2-6'    # 22h Brasília (mesmo dia do pregão)
    - cron: '0 6 * * 2-6'    # 03h Brasília (madrugada)
    - cron: '0 10 * * 2-6'   # 07h Brasília (dia seguinte)
    - cron: '0 13 * * 2-6'   # 10h Brasília (dia seguinte)
    - cron: '0 14 * * 2-6'   # 11h Brasília (dia seguinte)
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '18'
      - run: node scripts/atualizar_etf.js
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
      - run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add dados/historico_etf.json dados/historico_etf-data.js
          git commit -m "Atualiza historico do ETF BTC" || echo "Sem mudanças"
          git push
